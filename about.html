<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg: #f5f2ee;
      --ink: #1a1a18;
      --accent: #c8f04a;
      --accent2: #ff6b35;
      --card-bg: #ffffff;
      --border: #1a1a18;
      --muted: #6b6b68;
      --shadow: 5px 5px 0px #1a1a18;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
 
    /* ── NAV ── */
    nav {
      background: var(--ink);
      border-bottom: 3px solid var(--ink);
      display: flex;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
 
    nav a {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: #9a9a95;
      padding: 18px 32px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      position: relative;
      text-decoration: none;
      display: inline-block;
    }
 
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.2s;
    }
 
    nav a:hover { color: #ffffff; }
    nav a:hover::after { transform: scaleX(1); }
 
    nav a.active {
      color: var(--ink);
      background: var(--accent);
    }
    nav a.active::after { display: none; }
 
    /* ── PAGES ── */
    .page { display: none; padding: 48px 40px; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; animation: fadeUp 0.35s ease; }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    /* ── ABOUT PAGE ── */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
 
    .about-card {
      border: 3px solid var(--border);
      background: var(--card-bg);
      box-shadow: 5px 5px 0 var(--border);
      padding: 24px;
    }
 
    .about-card h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
 
    .about-card p { font-size: 0.92rem; line-height: 1.7; }
 
    .highlight-block {
      border: 3px solid var(--border);
      background: var(--accent);
      box-shadow: 5px 5px 0 var(--border);
      padding: 24px;
      margin-bottom: 20px;
    }
 
    .highlight-block p {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      line-height: 1.6;
    }
 
    /* ── EDITABLE HINT ── */
    [contenteditable]:focus { outline: 3px dashed var(--accent2); outline-offset: 2px; }
  </style>
</head>
<body>
 
  <nav role="navigation">
    <a href="index.html">Home</a>
  </nav>
 
  <div class="page active">
    <div class="highlight-block">
      <p>"I build things for the web — from pixel-perfect interfaces to robust backend systems. Currently open to full-time opportunities."</p>
    </div>
    <div class="about-grid">
      <div class="about-card">
        <h3>Background</h3>
        <p>desrcibe describe.</p>
      </div>
      <div class="about-card">
        <h3>Interests</h3>
        <p>aaaaaaaaa</p>
      </div>
      <div class="about-card">
        <h3>Experience</h3>
        <p>aaaaaaaa</p>
      </div>
      <div class="about-card">
        <h3>Goals</h3>
        <p>asasasass</p>
      </div>
    </div>
  </div>
 
</body>
</html>
