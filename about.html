<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2ee;
      --ink: #1a1a18;
      --accent: #c8f04a;
      --accent2: #ff6b35;
      --card-bg: #ffffff;
      --border: #1a1a18;
      --muted: #6b6b68;
      --shadow: 5px 5px 0px #1a1a18;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
        radial-gradient(circle at 20% 30%, rgba(200,240,74,0.15), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,107,53,0.12), transparent 35%),
        linear-gradient(135deg, #f5f2ee 0%, #fafaf7 100%);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      border: 8px solid var(--ink);
      box-shadow: inset 0 0 0 3px var(--accent), inset 0 0 0 11px var(--ink);
    }



    nav,
    .page {
      position: relative;
      z-index: 1;
    }

    nav {
      background: var(--ink);
      border-bottom: 3px solid var(--ink);
      display: flex;
      flex-wrap: nowrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: #9a9a95;
      padding: 18px 32px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      position: relative;
      text-decoration: none;
      display: inline-block;
      flex: 1 1 auto;
      text-align: center;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.2s;
    }

    nav a:hover { color: #ffffff; }
    nav a:hover::after { transform: scaleX(1); }

    nav a.active {
      color: var(--ink);
      background: var(--accent);
    }
    nav a.active::after { display: none; }

    .page { display: none; padding: 48px 40px; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; animation: fadeUp 0.35s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .about-card {
      border: 3px solid var(--border);
      background: var(--card-bg);
      box-shadow: 5px 5px 0 var(--border);
      padding: 24px;
    }

    .about-card h3 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .about-card p { font-size: 0.92rem; line-height: 1.7; }

    .highlight-block {
      border: 3px solid var(--border);
      background: var(--accent);
      box-shadow: 5px 5px 0 var(--border);
      padding: 24px;
      margin-bottom: 20px;
    }

    .highlight-block p {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    [contenteditable]:focus { outline: 3px dashed var(--accent2); outline-offset: 2px; }

    /* Spider-Man swinging across page */
    .spider-swing {
      animation: swingAcross 12s linear infinite;
    }

    @keyframes swingAcross {
      0% { left: -350px; top: 10%; transform: rotate(-10deg) scaleX(1); }
      25% { left: 20%; top: 15%; transform: rotate(5deg) scaleX(1); }
      50% { left: 50%; top: 25%; transform: rotate(0deg) scaleX(1.1); }
      75% { left: 80%; top: 18%; transform: rotate(-5deg) scaleX(1); }
      100% { left: 110%; top: 10%; transform: rotate(-10deg) scaleX(1); }
    }

    /* =====================
       MOBILE BREAKPOINTS
    ===================== */

    @media (max-width: 600px) {
      .page { padding: 24px 16px; }

      nav a {
        padding: 14px 12px;
        font-size: 0.7rem;
        letter-spacing: 0.07em;
      }

      .about-grid {
        grid-template-columns: 1fr;
      }

      .highlight-block {
        padding: 18px 16px;
      }

      .highlight-block p {
        font-size: 0.95rem;
      }

      .about-card {
        padding: 18px 16px;
      }
    }
  </style>

</head>
<body>

  <nav role="navigation">
    <a href="index.html">Name</a>
    <a href="about.html" class="active">About</a>
    <a href="techstack.html">Tech Stack</a>
    <a href="certification.html">Certifications</a>
  </nav>

  <!-- Spider-Man swinging across page - inline SVG -->
<img src="spiderswing.svg" class="spider-swing" alt="Spider swinging animation" style="position: fixed; top: 20%; left: 0; width: 300px; height: 100px; pointer-events: none; opacity: 0.25; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 0; animation: swingAcross 8s linear infinite; will-change: transform;">


  <div class="page active">
    <div class="highlight-block">
      <p>"I build things for the web from pixel-perfect interfaces to robust backend systems. Currently open to full-time opportunities."</p>
    </div>
    <div class="about-grid">
      <div class="about-card">
        <h3>Background</h3>
        <p>describe describe.</p>
      </div>
      <div class="about-card">
        <h3>Interests</h3>
        <p>aaaaaaaaa</p>
      </div>
      <div class="about-card">
        <h3>Experience</h3>
        <p>aaaaaaaa</p>
      </div>
      <div class="about-card">
        <h3>Goals</h3>
        <p>asasasass</p>
      </div>
    </div>
  </div>

  <script>
    // Pause swing animation on hover for interactivity
    const spider = document.querySelector('.spider-swing');
    spider.addEventListener('mouseenter', () => spider.style.animationPlayState = 'paused');
    spider.addEventListener('mouseleave', () => spider.style.animationPlayState = 'running');
  </script>
</body>
</html>
