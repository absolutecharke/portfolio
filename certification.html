<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Certifications | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav role="navigation">
    <a href="index.html">Name</a>
    <a href="about.html">About</a>
    <a href="techstack.html">Tech Stack</a>
    <a href="certification.html" class="active">Certifications</a>
  </nav>

  <img
    src="spiderswing.svg"
    class="spider-swing"
    alt="Spider swinging animation"
    style="position: fixed; top: 20%; left: 0; width: 300px; height: 100px; pointer-events: none; opacity: 0.25; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 0; animation: swingAcross 8s linear infinite; will-change: transform;"
  />

  <img
    src="batman.svg"
    class="batman-glide"
    alt="Batman gliding"
    style="position: fixed; bottom: 0; right: 0; width: 200px; height: 120px; pointer-events: none; opacity: 0.3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 0; will-change: transform;"
  />

  <div class="page active">
    <div class="section-title">Certifications</div>
    <div class="cert-list">
      <a class="cert-card" href="https://www.credly.com/badges/be4fa5d2-6551-4cd2-9711-a1925f8bef8e" target="_blank" rel="noopener noreferrer">
        <div class="cert-badge">
          <img src="pythonbadge.png" alt="Python Essentials 1 badge icon" style="max-width: 100%; max-height: 100%; display: block;">
        </div>
        <div class="cert-info">
          <h3>Python Essentials 1 Badge</h3>
          <p>Cisco Networking Academy</p>
        </div>
      </a>

      <a class="cert-card" href="https://www.credly.com/badges/c0d22a08-aca5-4efa-b632-0643a1a1cd1a" target="_blank" rel="noopener noreferrer">
        <div class="cert-badge">
          <img src="networking.png" alt="Networking Basics badge icon" style="max-width: 100%; max-height: 100%; display: block;">
        </div>
        <div class="cert-info">
          <h3>Networking Basics</h3>
          <p>Cisco Networking Academy</p>
        </div>
      </a>
    </div>
  </div>

  <script>
    // Pause swing animation on hover for interactivity
    const spiderEl = document.querySelector('.spider-swing');
    if (spiderEl) {
      spiderEl.addEventListener('mouseenter', () => spiderEl.style.animationPlayState = 'paused');
      spiderEl.addEventListener('mouseleave', () => spiderEl.style.animationPlayState = 'running');
    }
  </script>
<script>
    // Pause swing animation on hover for interactivity
    const BatmanGlide = document.querySelector('.batman-glide');
    if (BatmanGlide) {
      BatmanGlide.addEventListener('mouseenter', () => BatmanGlide.style.animationPlayState = 'paused');
      BatmanGlide.addEventListener('mouseleave', () => BatmanGlide.style.animationPlayState = 'running');
    }
  </script>
</body>
</html>
