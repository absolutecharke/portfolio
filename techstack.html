<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Stack | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg: #f5f2ee;
      --ink: #1a1a18;
      --accent: #c8f04a;
      --accent2: #ff6b35;
      --card-bg: #ffffff;
      --border: #1a1a18;
      --muted: #6b6b68;
      --shadow: 5px 5px 0px #1a1a18;
    }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
 
    /* ── NAV ── */
    nav {
      background: var(--ink);
      border-bottom: 3px solid var(--ink);
      display: flex;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
 
    nav a {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: #9a9a95;
      padding: 18px 32px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      position: relative;
      text-decoration: none;
      display: inline-block;
    }
 
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.2s;
    }
 
    nav a:hover { color: #ffffff; }
    nav a:hover::after { transform: scaleX(1); }
 
    nav a.active {
      color: var(--ink);
      background: var(--accent);
    }
    nav a.active::after { display: none; }
 
    /* ── PAGES ── */
    .page { display: none; padding: 48px 40px; max-width: 960px; margin: 0 auto; }
    .page.active { display: block; animation: fadeUp 0.35s ease; }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    /* ── SECTION TITLES ── */
    .section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 3px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 24px;
    }
 
    /* ── TECH STACK ── */
    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
 
    .stack-item {
      border: 3px solid var(--border);
      background: var(--card-bg);
      box-shadow: 4px 4px 0 var(--border);
      padding: 16px 12px;
      text-align: center;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      transition: transform 0.15s, box-shadow 0.15s;
    }
 
    .stack-item:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--border);
    }
 
    .stack-icon { font-size: 1.6rem; margin-bottom: 6px; }
 
    /* ── EDITABLE HINT ── */
    [contenteditable]:focus { outline: 3px dashed var(--accent2); outline-offset: 2px; }
  </style>
</head>
<body>
 
  <nav role="navigation">
    <a href="index.html">Home</a>
  </nav>
 
  <div class="page active">
    <div class="section-title">Languages & Frameworks</div>
    <div class="stack-grid">
      <div class="stack-item"><div class="stack-icon"></div>HTML / CSS</div>
      <div class="stack-item"><div class="stack-icon"></div>Java</div>
      <div class="stack-item"><div class="stack-icon"></div>SQL</div>
      <div class="stack-item"><div class="stack-icon"></div>PostgreSQL</div>
    </div>
    <div class="section-title">Tools & Platforms</div>
    <div class="stack-grid">
      <div class="stack-item"><div class="stack-icon"></div>Git / GitHub</div>
      <div class="stack-item"><div class="stack-icon"></div>VS Code</div>
      <div class="stack-item"><div class="stack-icon"></div>Netbeans</div>
    </div>
  </div>
 
</body>
</html>
