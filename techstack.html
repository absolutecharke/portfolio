<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tech Stack | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav role="navigation">
    <a href="index.html">Name</a>
    <a href="about.html">About</a>
    <a href="techstack.html" class="active">Tech Stack</a>
    <a href="certification.html">Certifications</a>
  </nav>

  <img
    src="spiderswing.svg"
    class="spider-swing"
    alt="Spider swinging animation"
    style="position: fixed; top: 20%; left: 0; width: 300px; height: 100px; pointer-events: none; opacity: 0.25; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 0; animation: swingAcross 8s linear infinite; will-change: transform;"
  />

  <img
    src="batman.svg"
    class="batman-glide"
    alt="Batman gliding"
    style="position: fixed; bottom: 0; right: 0; width: 200px; height: 120px; pointer-events: none; opacity: 0.3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 0; will-change: transform;"
  />

  <div class="page active">
    <div class="section-title">Languages & Frameworks</div>
    <div class="stack-grid">
      <div class="stack-item"><div class="stack-icon"><img src="html.png" alt="HTML icon"></div>HTML</div>
      <div class="stack-item"><div class="stack-icon"><img src="css-3.svg" alt="CSS icon"></div>CSS</div>
      <div class="stack-item"><div class="stack-icon"><img src="java.png" alt="Java icon"></div>Java</div>
      <div class="stack-item"><div class="stack-icon"><img src="sql.svg" alt="SQL icon"></div>SQL</div>
      <div class="stack-item"><div class="stack-icon"><img src="postgresql.png" alt="PostgreSQL icon"></div>PostgreSQL</div>
    </div>

    <div class="section-title">Tools & Platforms</div>
    <div class="stack-grid">
      <div class="stack-item"><div class="stack-icon"><img src="git.png" alt="Git icon"></div>Git</div>
      <div class="stack-item"><div class="stack-icon"><img src="github.png" alt="GitHub icon"></div>GitHub</div>
      <div class="stack-item"><div class="stack-icon"><img src="vscode.png" alt="VS Code icon"></div>VS Code</div>
      <div class="stack-item"><div class="stack-icon"><img src="netbeans.png" alt="Netbeans icon"></div>Netbeans</div>
    </div>
  </div>

  <script>
    // Pause swing animation on hover for interactivity
    const spiderEl = document.querySelector('.spider-swing');
    if (spiderEl) {
      spiderEl.addEventListener('mouseenter', () => spiderEl.style.animationPlayState = 'paused');
      spiderEl.addEventListener('mouseleave', () => spiderEl.style.animationPlayState = 'running');
    }
  </script>

</body>
</html>
